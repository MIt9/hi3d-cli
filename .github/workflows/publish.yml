name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm install
      - run: npm test
      - name: Debug OIDC claims
        run: |
          echo "GITHUB_REPOSITORY=$GITHUB_REPOSITORY"
          echo "GITHUB_REF=$GITHUB_REF"
          echo "GITHUB_WORKFLOW=$GITHUB_WORKFLOW"
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "Requesting OIDC token for sigstore..."
          OIDC_JSON=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sigstore" || echo "{}")
          echo "OIDC raw: $OIDC_JSON" | head -c 500
          echo ""
          PAYLOAD=$(echo "$OIDC_JSON" | jq -r '.value' 2>/dev/null | cut -d. -f2)
          if [ -n "$PAYLOAD" ] && [ "$PAYLOAD" != "null" ]; then
            echo "$PAYLOAD" | base64 -d 2>/dev/null | jq . 2>/dev/null | head -100
          else
            echo "No OIDC value, trying registry audience..."
            OIDC2=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://registry.npmjs.org" || echo "{}")
            echo "$OIDC2" | head -c 500
            PAYLOAD2=$(echo "$OIDC2" | jq -r '.value' 2>/dev/null | cut -d. -f2)
            echo "$PAYLOAD2" | base64 -d 2>/dev/null | jq . 2>/dev/null | head -100
          fi
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # OIDC Trusted Publishing (id-token: write) fallback — if NPM_TOKEN not set, OIDC will be used
      # Configure at https://www.npmjs.com/package/hi3d-cli/access → Trusted Publishers → MIt9/hi3d-cli publish.yml
