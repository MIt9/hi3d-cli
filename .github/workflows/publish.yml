name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm install
      - run: npm test
      - name: Publish to npm
        run: npm publish --provenance --access public --loglevel verbose
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # Classic Automation token (Bypass 2FA) — fallback until OIDC cross-account is fixed
      # Trusted publishing (OIDC) also configured at https://www.npmjs.com/package/hi3d-cli/access → MIt9/hi3d-cli publish.yml
